<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bubu Agent</title>
  <meta name="description" content="Bubu Agent — 让花成花，让树成树，让时间属于你。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --fg: #000;
      --muted: rgba(0, 0, 0, 0.75);
      --label: #7f7f7f;
      --bg: #fff;
      --chip: #000;
      --chip-fg: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      padding: 48px 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: Geist, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(340px, 100%); }
    h1 {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
      text-wrap: balance;
    }
    .lede, .body {
      margin: 0 0 10px;
      color: var(--muted);
      max-width: 36em;
      text-wrap: pretty;
    }
    .body { margin-bottom: 28px; }
    section + section { margin-top: 22px; }
    .section-label {
      margin: 0 0 10px;
      color: var(--label);
    }
    .rows {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .rows li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 20px;
    }
    .rows span { color: var(--fg); flex: 1 1 auto; }
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      min-height: 20px;
      padding: 2px 5px;
      margin: -10px 0;
      background: var(--chip);
      color: var(--chip-fg);
      text-decoration: none;
      white-space: nowrap;
      border-radius: 0;
      transition: opacity 120ms ease;
    }
    .chip:hover { opacity: 0.82; }
    .chip:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      .chip { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Bubu Agent</h1>
    <p class="lede">让花成花，让树成树，让时间属于你。</p>
    <p class="body">面向企业里真正干活的团队，帮你把日常工作顺利推进下去。项目仍在快速迭代。</p>

    <section aria-labelledby="personal">
      <p class="section-label" id="personal">个人版:</p>
      <ul class="rows">
        <li>
          <span>Windows:</span>
          <a class="chip" id="download" href="https://github.com/BranchCrypto/Bubu-Agent/releases/latest/download/bbu-windows.zip">获取安装包</a>
        </li>
        <li>
          <span>当前版本:</span>
          <a class="chip" id="version" href="https://github.com/BranchCrypto/Bubu-Agent/releases/latest">最新版</a>
        </li>
      </ul>
    </section>

    <section aria-labelledby="enterprise">
      <p class="section-label" id="enterprise">企业版:</p>
      <ul class="rows">
        <li>
          <span>请联系我:</span>
          <a class="chip" href="mailto:branchweb3@gmail.com">branchweb3@gmail.com</a>
        </li>
      </ul>
    </section>
  </main>
  <script>
    fetch('https://api.github.com/repos/BranchCrypto/Bubu-Agent/releases/latest')
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        if (!data || !data.tag_name) return
        const version = document.getElementById('version')
        version.textContent = data.tag_name
        version.href = data.html_url || version.href
        const asset = (data.assets || []).find((a) => a.name === 'bbu-windows.zip')
        if (asset && asset.browser_download_url) {
          document.getElementById('download').href = asset.browser_download_url
        }
      })
      .catch(() => {})
  </script>
</body>
</html>
