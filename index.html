<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bubu</title>
  <meta name="description" content="Bubu — Windows desktop coding agent. Download the latest release." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --fg: #000;
      --muted: rgba(0, 0, 0, 0.75);
      --faint: rgba(0, 0, 0, 0.5);
      --label: #7f7f7f;
      --bg: #fff;
      --chip: #000;
      --chip-fg: #fff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      padding: 48px 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: Geist, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(340px, 100%);
    }

    .mark {
      display: block;
      width: 18px;
      height: 18px;
      margin-bottom: 18px;
      color: var(--fg);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
    }

    .lede,
    .body {
      margin: 0 0 10px;
      color: var(--muted);
      max-width: 34em;
    }

    .tags {
      margin: 0 0 28px;
      color: var(--faint);
    }

    .section-label {
      margin: 0 0 10px;
      color: var(--label);
    }

    .links {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .links li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 20px;
    }

    .links span {
      color: var(--fg);
      flex: 1 1 auto;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      padding: 2px 5px;
      background: var(--chip);
      color: var(--chip-fg);
      text-decoration: none;
      white-space: nowrap;
      border-radius: 0;
      transition: opacity 120ms ease;
    }

    .chip:hover { opacity: 0.82; }
    .chip:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .chip { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 18 18" aria-hidden="true">
      <rect x="1" y="1" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" />
      <path d="M5 9h8M9 5v8" stroke="currentColor" stroke-width="1.5" />
    </svg>

    <h1>Bubu</h1>
    <p class="lede">Windows 桌面编程助手。</p>
    <p class="body">下载安装包，解压后运行即可。在设置里填入 LLM API Key 开始对话。</p>
    <p class="tags">Windows 10/11 \ Desktop agent \ Single binary</p>

    <p class="section-label">Important Links:</p>
    <ul class="links">
      <li>
        <span>Download:</span>
        <a class="chip" id="download" href="https://github.com/BranchCrypto/bbu-releases/releases/latest/download/bbu-windows.zip">bbu-windows.zip</a>
      </li>
      <li>
        <span>Version:</span>
        <a class="chip" id="version" href="https://github.com/BranchCrypto/bbu-releases/releases/latest">latest</a>
      </li>
      <li>
        <span>All releases:</span>
        <a class="chip" href="https://github.com/BranchCrypto/bbu-releases/releases">Releases</a>
      </li>
      <li>
        <span>Checksum:</span>
        <a class="chip" href="https://github.com/BranchCrypto/bbu-releases/releases/latest/download/SHA256SUMS">SHA256SUMS</a>
      </li>
    </ul>
  </main>
  <script>
    fetch('https://api.github.com/repos/BranchCrypto/bbu-releases/releases/latest')
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        if (!data || !data.tag_name) return
        const version = document.getElementById('version')
        version.textContent = data.tag_name
        version.href = data.html_url || version.href
        const asset = (data.assets || []).find((a) => a.name === 'bbu-windows.zip')
        if (asset && asset.browser_download_url) {
          document.getElementById('download').href = asset.browser_download_url
        }
        const sums = (data.assets || []).find((a) => a.name === 'SHA256SUMS')
        if (sums && sums.browser_download_url) {
          document.querySelector('a[href*="SHA256SUMS"]').href = sums.browser_download_url
        }
      })
      .catch(() => {})
  </script>
</body>
</html>
